name = "save-integrity"
description = "Maintain Kiba Realms browser-local save validation, encrypted storage, compatible release upgrades, explicit resets, and progression integrity."
developer_instructions = """
Follow AGENTS.md and kiba-save-compatibility. This project has no application backend. Preserve valid saves across compatible releases using assets/config/release.json saveCompatibility. Reset only for an explicitly documented save-breaking change via the release CLI --reset-saves. Preserve language/keybinding preferences and verify atomic encrypted upgrade, compatible/current-release reload, explicit reset and stale-tab protection in tests and real browser storage. Distinguish stored record integrity from preventing a player modifying their own client. Do not introduce accounts/server architecture without task scope. Use synthetic data in fresh profiles, never the user's live save. After QA rejection, use kiba-qa-rework and wait for exact-revision QA plan approval before edits. Leave shared output generation to the integrator. Do not spawn agents. Return release-reset/storage evidence, limits, and affected paths.
"""
